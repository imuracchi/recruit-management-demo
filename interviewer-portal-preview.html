<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面接・自身の予定｜MY CAREER</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#24324b;background:#f7f9fc}header{background:white;border-bottom:1px solid #e1e6ee;padding:20px 28px;display:flex;align-items:center;gap:22px}.brand{font-size:14px;color:#2856a7;font-weight:800;letter-spacing:1px}h1{font-size:22px;margin:0}.demo{font-size:12px;color:#687691;margin:8px 0 0}main{padding:24px 28px;max-width:1700px;margin:auto}.toolbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}.toolbar button{background:white;border:1px solid #dce3ec;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:18px}.toolbar b{font-size:18px}.section{margin-bottom:30px}h2{font-size:18px;margin:0 0 7px}.description{font-size:13px;color:#687691;margin:0 0 14px}.legend{display:inline-flex;gap:16px;margin-left:15px;font-size:12px;font-weight:400}.legend i{display:inline-block;width:9px;height:9px;background:#1a73e8;border-radius:3px;margin-right:5px}.legend .green{background:#0b8c6a}.calendar{background:white;border:1px solid #dce3ec;border-radius:12px;overflow-x:auto;max-height:none}.week{display:grid;grid-template-columns:66px repeat(7,minmax(120px,1fr));min-width:906px}.head{position:sticky;top:0;background:white;z-index:3;text-align:center;border-bottom:1px solid #dce3ec;padding:12px 0;height:75px}.head span{display:block;font-size:12px;color:#687691}.head b{display:block;font-size:23px;font-weight:500;margin-top:4px}.head.weekend{background:#fafbfe}.timehead{font-size:11px;color:#687691;padding-top:32px}.timeaxis{position:relative}.timeaxis span{position:absolute;right:10px;font-size:10px;color:#687691;transform:translateY(3px)}.day{position:relative;border-left:1px solid #e4e9f0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,#e9edf3 43px,#e9edf3 44px)}.event{position:absolute;background:#e5efff;border-left:3px solid #1a73e8;color:#154688;border-radius:5px;padding:5px 6px;overflow:hidden;font-size:11px;line-height:1.3}.event b{display:block;font-weight:600}.event span{display:block;margin-top:3px}.event.personal{background:#e0f3ec;border-color:#0b8c6a;color:#076149}button:focus-visible{outline:3px solid #fb923c}@media(max-width:600px){header{padding:16px;display:block}h1{margin-top:8px}main{padding:18px 12px}.toolbar{gap:8px}.toolbar b{font-size:14px}.legend{display:flex;margin:8px 0}.calendar{max-height:none}}.toolbar{flex-wrap:wrap}.period{display:flex;gap:0;margin-left:auto;border:1px solid #dce3ec;border-radius:8px;overflow:hidden}.period button{border:0;border-radius:0;font-size:13px;margin:0}.period button[aria-pressed="true"]{background:#1a73e8;color:white}@media(max-width:600px){.period{margin-left:0}}</style></head><body><header><div class="brand">MY CAREER</div><div><h1>面接・自身の予定</h1><p class="demo">面接と自身の予定をまとめて表示します。Googleカレンダーとの実連携はまだありません。</p></div></header><main><div class="toolbar"><button onclick="move(-1)" aria-label="前の期間">‹</button><button onclick="move(1)" aria-label="次の期間">›</button><button onclick="today()" style="font-size:13px">今日</button><b id="range"></b><div class="period" role="group" aria-label="表示日数"><button id="days1" onclick="setDays(1)" aria-pressed="false">今日だけ</button><button id="days3" onclick="setDays(3)" aria-pressed="false">3日間</button><button id="days7" onclick="setDays(7)" aria-pressed="true">7日間</button></div></div><section class="section"><h2><span id="periodTitle">今日から7日間の予定</span> <span class="legend"><span><i></i>面接・面談</span><span><i class="green"></i>自身の予定</span></span></h2><p class="description">面接・面談と自身の予定をまとめて表示します。</p><div id="own" class="calendar"></div></section></main><script>const seed={
interviewer:[{id:'ca-1',name:'山田 太郎',kind:'一次面接',start:'2026-10-13T10:00',end:'2026-10-13T11:00',unread:1},{id:'ca-2',name:'佐藤 花子',kind:'一次面接',start:'2026-10-13T13:30',end:'2026-10-13T14:30',unread:1},{id:'ca-3',name:'鈴木 健',kind:'再面接',start:'2026-10-14T16:00',end:'2026-10-14T17:00',unread:0}],
mentor:[{id:'mentor-1',name:'高橋 美咲',kind:'面談',start:'2026-10-13T11:30',end:'2026-10-13T12:00',unread:1},{id:'mentor-2',name:'伊藤 翔',kind:'フォロー面談',start:'2026-10-14T15:00',end:'2026-10-14T15:30',unread:0}]};
const key='mycareer-portal-demo-v2';
let people=seed;try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s?.people)people=s.people}catch(e){}
const interviews=people.interviewer.map(p=>({...p,title:p.name+' ／ '+p.kind}));
const own=[...interviews,{id:'private-1',title:'社内ミーティング',start:'2026-10-13T09:00',end:'2026-10-13T09:45',private:true},{id:'private-2',title:'資料整理',start:'2026-10-14T13:00',end:'2026-10-14T14:00',private:true},{id:'private-3',title:'社内ミーティング',start:'2026-10-15T11:00',end:'2026-10-15T12:00',private:true}];
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let monday=new Date(dateStr(new Date())+'T00:00:00+09:00');
function dateStr(d){return new Date(d.getTime()+9*3600000).toISOString().slice(0,10)}

function today(){monday=new Date(dateStr(new Date())+'T00:00:00+09:00');render()}
let visibleDays=7;
function setDays(n){visibleDays=n;today()}
function move(n){monday=new Date(monday.getTime()+n*visibleDays*86400000);render()}
function minutes(s){return Number(s.slice(11,13))*60+Number(s.slice(14,16))}
function arrange(events){
const sorted=events.slice().sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end)||a.id.localeCompare(b.id));
const result=[];let group=[],groupEnd='',lanes=[];
function finish(){for(const item of group)result.push({...item,columns:lanes.length});group=[];lanes=[]}
for(const event of sorted){
if(group.length&&event.start>=groupEnd)finish();
let column=lanes.findIndex(end=>end<=event.start);if(column<0)column=lanes.length;
lanes[column]=event.end;group.push({event,column});groupEnd=group.length===1?event.end:(groupEnd>event.end?groupEnd:event.end);
}
finish();return result;
}
function calendar(id,events){
const dates=Array.from({length:visibleDays},(_,i)=>dateStr(new Date(monday.getTime()+i*86400000)));
const weekEvents=events.filter(e=>dates.includes(e.start.slice(0,10)));let start=8,end=20;
weekEvents.forEach(e=>{start=Math.min(start,Math.floor(minutes(e.start)/60));end=Math.max(end,Math.ceil(minutes(e.end)/60))});const hours=end-start,height=hours*44;
let h='<div class="week" style="grid-template-columns:66px repeat('+visibleDays+',minmax(120px,1fr));min-width:'+(66+visibleDays*120)+'px"><div class="head timehead">JST</div>'+dates.map((d,i)=>'<div class="head '+([0,6].includes(new Date(d+'T12:00:00+09:00').getUTCDay())?'weekend':'')+'"><span>'+['日','月','火','水','木','金','土'][new Date(d+'T12:00:00+09:00').getUTCDay()]+'</span><b>'+Number(d.slice(8))+'</b></div>').join('');
h+='<div class="timeaxis" style="height:'+height+'px">'+Array.from({length:hours},(_,i)=>'<span style="top:'+(i*44)+'px">'+String(start+i).padStart(2,'0')+':00</span>').join('')+'</div>';
h+=dates.map(d=>{
const rows=events.filter(e=>e.start.slice(0,10)===d).sort((a,b)=>a.start.localeCompare(b.start));
return '<div class="day" style="height:'+height+'px">'+arrange(rows).map(({event:e,column,columns})=>{const top=(minutes(e.start)-start*60)*44/60;const size=(minutes(e.end)-minutes(e.start))*44/60;const slot=column,width=100/columns;
return '<div class="event '+(e.private?'personal':'')+'" style="top:'+top+'px;height:'+Math.max(24,size)+'px;left:calc('+slot*width+'% + 3px);width:calc('+width+'% - 6px)" title="'+esc(e.title)+' '+e.start.slice(11)+'〜'+e.end.slice(11)+'"><b>'+esc(e.title)+'</b><span>'+e.start.slice(11)+'〜'+e.end.slice(11)+'</span></div>'}).join('')+'</div>'
}).join('')+'</div>';$ (id).innerHTML=h;
}
function render(){[1,3,7].forEach(n=>{$('days'+n).setAttribute('aria-pressed',String(n===visibleDays))});const last=dateStr(new Date(monday.getTime()+(visibleDays-1)*86400000));$('range').textContent=dateStr(monday).replaceAll('-','/')+' — '+last.replaceAll('-','/');$('periodTitle').textContent=visibleDays===1?'1日の予定':visibleDays+'日間の予定';calendar('own',own)}
render();
</script></body></html>
