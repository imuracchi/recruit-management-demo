<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面接記録｜MY CAREER</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#17213a;background:#f3f6fb}.notice{padding:10px;background:#fff4ce;text-align:center;font-size:12px}header{background:#10265f;color:white;padding:22px}header a{color:white}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:25px}h2{font-size:18px}.toolbar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}.card{background:white;border:1px solid #dce4f0;border-radius:12px;padding:22px;margin-bottom:20px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}input,select,textarea{font:inherit;padding:10px;border:1px solid #cbd5e4;border-radius:8px;max-width:100%}textarea{width:100%;min-height:180px}.formgrid{display:flex;gap:20px;flex-wrap:wrap}button,.button{display:inline-block;border:0;border-radius:8px;padding:11px 18px;background:#1a56db;color:white;text-decoration:none;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #fb923c}.record{border:1px solid #dce4f0;border-radius:9px;padding:16px;margin:12px 0}.record summary{cursor:pointer}.badge{display:inline-block;margin-left:12px;padding:4px 8px;background:#eaf1ff;color:#164eb8;border-radius:6px;font-size:12px}.preview{color:#687691;font-size:13px;margin-top:8px;overflow-wrap:anywhere}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}small,.empty{color:#687691}#feedback{padding:10px 0}.filters{display:flex;gap:12px;flex-wrap:wrap}#query{flex:1;min-width:180px}@media(max-width:600px){main{padding:14px}.card{padding:16px}}</style></head><body><div class="notice">操作デモ｜面接記録はこのブラウザだけに保存されます。実際の個人情報は入力しないでください。</div><header><b>MY CAREER ／ 面接記録</b><div style="margin-top:12px"><a href="interviewer-portal-preview.html#candidates">← 担当候補者・チャットに戻る</a></div></header><main><h1 id="heading">面接記録</h1><div class="toolbar"><div><label for="role">役割</label><select id="role" onchange="changeRole()"><option value="interviewer">CA</option><option value="mentor">メンター</option></select></div><div><label for="candidate">担当候補者</label><select id="candidate" onchange="choose(this.value)"></select></div><a class="button" style="align-self:end" href="#new">＋ 新しい記録をつける</a></div><section class="card"><h2>過去の面接記録 <small id="count"></small></h2><p>日時の新しい順に表示します。記録をクリックすると全文を確認できます。</p><div class="filters"><input id="query" aria-label="記録を検索" placeholder="面接内容・記録者・日付で検索" oninput="renderList()"><select id="filter" aria-label="評価で絞り込み" onchange="renderList()"><option value="">すべての評価</option><option>未評価</option><option>次の選考へ</option><option>継続フォロー</option><option>見送り</option></select></div><div id="list"></div></section><div id="feedback" role="status" aria-live="polite"></div><section id="new" class="card"><h2>新しい面接記録</h2><form onsubmit="save(event)"><div class="formgrid"><div><label for="date">実施日時（JST）</label><input id="date" type="datetime-local" required></div><div><label for="evaluation">評価</label><select id="evaluation"><option>未評価</option><option>次の選考へ</option><option>継続フォロー</option><option>見送り</option></select></div></div><label for="body">面接内容・申し送り</label><textarea id="body" maxlength="10000" required placeholder="面接で確認した内容や、次回に向けた申し送りを記録"></textarea><p><button>面接記録を保存</button></p><small>保存済みの記録は履歴として残ります。候補者には表示されません。</small></form></section></main><script>const seed={
interviewer:[{id:'ca-1',name:'山田 太郎',kind:'一次面接',start:'2026-10-13T10:00',end:'2026-10-13T11:00',unread:1},{id:'ca-2',name:'佐藤 花子',kind:'一次面接',start:'2026-10-13T13:30',end:'2026-10-13T14:30',unread:1},{id:'ca-3',name:'鈴木 健',kind:'再面接',start:'2026-10-14T16:00',end:'2026-10-14T17:00',unread:0}],
mentor:[{id:'mentor-1',name:'高橋 美咲',kind:'面談',start:'2026-10-13T11:30',end:'2026-10-13T12:00',unread:1},{id:'mentor-2',name:'伊藤 翔',kind:'フォロー面談',start:'2026-10-14T15:00',end:'2026-10-14T15:30',unread:0}]};
const key='mycareer-portal-demo-v2';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fresh(){return {people:JSON.parse(JSON.stringify(seed)),messages:{},records:{},history:[],drafts:{}}}
let state=fresh();try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s&&s.people&&s.records&&s.drafts)state=s}catch(e){$('feedback').textContent='保存データを読み込めませんでした。'}
const params=new URLSearchParams(location.search);let role=params.get('role')==='mentor'?'mentor':'interviewer';let active=state.people[role].some(p=>p.id===params.get('candidate'))?params.get('candidate'):state.people[role][0].id;
function person(){return state.people[role].find(p=>p.id===active)}
function stash(){state.drafts[active]={...(state.drafts[active]||{}),date:$('date').value,evaluation:$('evaluation').value,body:$('body').value}}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch(e){return false}}
function choose(id){stash();persist();active=id;render()}
function changeRole(){stash();persist();role=$('role').value;active=state.people[role][0].id;render()}
function render(){
$('role').value=role;$('candidate').innerHTML=state.people[role].map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');$('candidate').value=active;
$('heading').textContent=person().name+'さんの面接記録';
const d=state.drafts[active]||{};$('date').value=d.date||person().start;$('evaluation').value=d.evaluation||'未評価';$('body').value=d.body||'';
renderList()
}
function renderList(){
const q=$('query').value.trim(),evaluation=$('filter').value;
const rows=(state.records[active]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(r=>(!evaluation||r.evaluation===evaluation)&&(!q||(r.body+' '+r.author+' '+r.date).includes(q)));
$('count').textContent=rows.length+'件';
$('list').innerHTML=rows.length?rows.map(r=>'<details class="record"><summary><strong>'+esc(r.date.replace('T',' '))+'</strong><span class="badge">'+esc(r.evaluation)+'</span><div class="preview">'+esc(r.body.slice(0,90))+'</div></summary><p class="body">'+esc(r.body)+'</p><small>記録者：'+esc(r.author)+' ／ 保存日時：'+esc(r.savedAt)+'</small></details>').join(''):'<p class="empty">該当する面接記録はありません。</p>'
}
function save(e){
e.preventDefault();stash();const d=state.drafts[active];if(!d.date||!d.body.trim())return;
const r={date:d.date,evaluation:d.evaluation,body:d.body.trim(),author:role==='mentor'?'田中（メンター）':'田中（CA）',savedAt:new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})};
if(!state.records[active])state.records[active]=[];
state.records[active].push(r);state.drafts[active].body='';
if(!persist()){state.records[active].pop();state.drafts[active].body=r.body;$('feedback').textContent='保存できませんでした。入力内容を保持しています。';return}
$('query').value='';$('filter').value='';render();$('feedback').textContent='面接記録をこのブラウザに保存しました。記録一覧から後で見直せます。';$('list').scrollIntoView({behavior:'smooth'})
}
window.addEventListener('beforeunload',()=>{stash();persist()});render();
</script></body></html>
