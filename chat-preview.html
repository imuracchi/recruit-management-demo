<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チャット機能 テスト画面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3fb;color:#17213a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.notice{background:#fff4ce;color:#6b5200;padding:10px 18px;text-align:center;font-weight:700;font-size:13px}.wrap{max-width:1180px;margin:20px auto;padding:0 16px}.title{margin:0 0 6px}.desc{margin:0 0 18px;color:#65718a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #dbe3ef;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #173e7a12}.head{padding:16px 18px;border-bottom:1px solid #dbe3ef}.head h2{font-size:17px;margin:0 0 4px}.head p{font-size:12px;margin:0;color:#65718a}.url{padding:12px 18px;background:#f7f9fd;border-bottom:1px solid #dbe3ef;font-size:12px;color:#1a56db;word-break:break-all}.messages{height:430px;overflow:auto;padding:16px;background:#f8fafd;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;padding:10px 12px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.msg.mine{align-self:flex-end;background:#1a56db;color:white;border-bottom-right-radius:4px}.msg.theirs{align-self:flex-start;background:white;border:1px solid #dbe3ef;border-bottom-left-radius:4px}.meta{font-size:10px;opacity:.7;margin-top:4px}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #dbe3ef}.compose textarea{flex:1;min-height:54px;resize:none;border:1px solid #cbd5e4;border-radius:9px;padding:10px;font:inherit}.compose button{border:0;border-radius:9px;background:#1a56db;color:white;padding:0 18px;font-weight:700;cursor:pointer}.badge{display:inline-flex;background:#dc2626;color:white;border-radius:11px;min-width:22px;height:22px;align-items:center;justify-content:center;font-size:11px;margin-left:6px}.checks{background:#fff;margin-top:18px;border-radius:12px;padding:16px 20px;border:1px solid #dbe3ef}.checks label{display:block;padding:5px 0}.reset{float:right;border:1px solid #bfcbe0;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}@media(max-width:780px){.grid{grid-template-columns:1fr}.messages{height:330px}}
</style></head><body>
<div class="notice">ローカルテスト画面です。本番データへの保存・メール送信・デプロイは行いません。</div>
<main class="wrap"><button class="reset" onclick="resetDemo()">テスト内容をリセット</button><h1 class="title">応募者チャット 動作確認</h1><p class="desc">左右どちらからでも送信できます。反対側に同じ内容が表示されることを確認してください。</p>
<div class="grid">
<section class="panel staff"><div class="head"><h2>スタッフ側 <span id="staffBadge"></span></h2><p>既存システムの応募者詳細内に表示する想定</p></div><div class="url">専用URL：https://example.test/recruit/chat.php?token=（チャット専用トークン）</div><div class="messages" id="staffMessages"></div><div style="padding:10px 12px 0"><label style="font-size:12px;font-weight:700">定型文：</label><select id="previewTemplate" onchange="applyPreviewTemplate(this.value)" style="padding:7px;border:1px solid #cbd5e4;border-radius:7px"><option value="">選択してください</option><option value="schedule">面接日程調整のお願い</option><option value="followup">確認のお願い</option></select></div><form class="compose" onsubmit="send(event,'staff')"><textarea id="staffInput" maxlength="2000" placeholder="応募者へのメッセージを入力"></textarea><button>送信</button></form></section>
<section class="panel candidate"><div class="head"><h2>候補者側 <span id="candidateBadge"></span></h2><p>スマートフォン対応の専用チャット画面</p></div><div class="url">採用担当者とのチャット｜山田 太郎 様</div><div class="messages" id="candidateMessages"></div><form class="compose" onsubmit="send(event,'candidate')"><textarea id="candidateInput" maxlength="2000" placeholder="メッセージを入力"></textarea><button>送信</button></form></section>
</div>
<section class="checks"><strong>画面テスト項目</strong><label><input type="checkbox"> スタッフから送ると候補者側にも表示される</label><label><input type="checkbox"> 候補者から送るとスタッフ側にも表示される</label><label><input type="checkbox"> 改行・長い文章が崩れず表示される</label><label><input type="checkbox"> 画面幅を狭くすると縦並びになる</label><label><input type="checkbox"> 既存の日程調整・事前確認とは別URLである</label></section></main>
<script>
let items=[];let unread={staff:0,candidate:1};let precheckDone=false;let scheduleReady=false;let precheckStep=0;const precheckAnswers={};
const precheckQuestions=[
  {key:'startDate',text:'実際に働き始められる日を教えてください。',type:'date'},
  {key:'employment',text:'現在の就業状況を教えてください。',options:['在職中','離職中','学生']},
  {key:'gradYear',text:'卒業予定年を教えてください。',type:'year',studentOnly:true},
  {key:'jitan',text:'介護・育児等で時短勤務の希望はありますか？',options:['希望なし','希望あり']},
  {key:'tsuin',text:'通院・服薬など、勤務にあたって配慮があると安心な事柄はありますか？',options:['なし','あり']},
  {key:'tokyo',text:'入社後の東京研修への参加について教えてください。',options:['参加できる','引越しが必要','参加が難しい','一都三県在住のため引越し不要']}
];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function currentPrecheckQuestion(){while(precheckQuestions[precheckStep]?.studentOnly&&precheckAnswers.employment!=='学生')precheckStep++;return precheckQuestions[precheckStep]}
function precheckHtml(){if(precheckDone)return scheduleReady?`<div class="msg theirs" style="max-width:92%"><strong>事前確認が完了しました</strong><div style="margin:7px 0">続けて面接日程を選択してください。</div><button onclick="alert('本実装では既存の日程調整画面へ移動します')" style="width:100%;padding:11px;border:0;border-radius:8px;background:#059669;color:#fff;font-weight:700;cursor:pointer">面接日程を調整する</button></div>`:'';const q=currentPrecheckQuestion();if(!q)return'';let input='';if(q.type==='date')input=`<input id="precheckDate" type="date" style="padding:9px;border:1px solid #cbd5e4;border-radius:7px"><button onclick="answerPrecheck(document.getElementById('precheckDate').value)" style="padding:9px 13px;margin-left:6px;border:0;border-radius:7px;background:#1a56db;color:#fff">回答する</button>`;else if(q.type==='year')input=`<input id="precheckYear" type="number" min="2026" max="2040" placeholder="例：2027" style="padding:9px;width:130px;border:1px solid #cbd5e4;border-radius:7px"><button onclick="answerPrecheck(document.getElementById('precheckYear').value)" style="padding:9px 13px;margin-left:6px;border:0;border-radius:7px;background:#1a56db;color:#fff">回答する</button>`;else input=q.options.map(x=>`<button onclick="answerPrecheck('${x}')" style="display:block;width:100%;margin-top:7px;padding:9px;border:1px solid #9bb4df;border-radius:8px;background:#fff;color:#17448f;cursor:pointer">${x}</button>`).join('');return `<div class="msg theirs" style="max-width:92%"><strong>事前確認</strong><div style="margin:7px 0">${q.text}</div>${input}</div>`}
function render(){for(const side of ['staff','candidate']){let html=items.map(x=>`<div class="msg ${x.from===side?'mine':'theirs'}"><div>${esc(x.text)}</div><div class="meta">${x.from==='staff'?'採用担当者':'山田 太郎'}　${x.at}</div></div>`).join('');if(side==='candidate')html+=precheckHtml();document.getElementById(side+'Messages').innerHTML=html;const b=document.getElementById(side+'Badge');b.innerHTML=unread[side]?`<span class="badge">${unread[side]}</span>`:''}document.getElementById('candidateInput').disabled=!precheckDone;document.getElementById('candidateInput').placeholder=precheckDone?'メッセージを入力':'事前確認完了後にチャットできます'}
function answerPrecheck(value){if(!value){alert('回答を入力してください');return}const q=currentPrecheckQuestion();precheckAnswers[q.key]=value;precheckStep++;currentPrecheckQuestion();if(precheckStep>=precheckQuestions.length){precheckDone=true;scheduleReady=precheckAnswers.employment!=='学生'&&precheckAnswers.jitan==='希望なし'&&precheckAnswers.tsuin==='なし'&&(precheckAnswers.tokyo==='参加できる'||precheckAnswers.tokyo==='一都三県在住のため引越し不要');items.push({from:'candidate',text:'事前確認に回答しました。',at:'たった今',event:true});items.push({from:'staff',text:scheduleReady?'事前確認へのご回答ありがとうございます。\n続けて、面接日程の調整をお願いいたします。':'事前確認へのご回答ありがとうございます。\n内容を担当者が確認し、改めてご連絡いたします。',at:'自動メッセージ',event:true})}render();document.getElementById('candidateMessages').scrollTop=99999}
function send(e,from){e.preventDefault();if(from==='candidate'&&!precheckDone)return;const input=document.getElementById(from+'Input');const text=input.value.trim();if(!text)return;items.push({from,text,at:'たった今'});input.value='';unread[from==='staff'?'candidate':'staff']++;unread[from]=0;render();document.getElementById(from+'Messages').scrollTop=99999}
function resetDemo(){items=[{from:'staff',text:'ご応募ありがとうございます。まずは事前確認にご回答ください。',at:'自動メッセージ',event:true}];unread={staff:0,candidate:0};precheckDone=false;scheduleReady=false;precheckStep=0;Object.keys(precheckAnswers).forEach(k=>delete precheckAnswers[k]);render()}
function applyPreviewTemplate(type){const url='https://example.test/recruit/form.php?token=（日程調整専用トークン）';const t={schedule:`面接日程の調整をお願いいたします。\n以下のURLからご都合のよい日時をお選びください。\n${url}\n\n※面接官の日程が表示されるまで30秒ほどかかる場合があります。`,followup:'先日ご案内した内容について、ご確認をお願いいたします。\nご不明点がございましたら、このチャットへご返信ください。'};if(type)document.getElementById('staffInput').value=t[type]||'';document.getElementById('previewTemplate').value=''}
resetDemo();
</script></body></html>
